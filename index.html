<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Highr – A destination for distinctive homes</title>
  <meta name="description" content="Highr is a premium real-estate and architecture studio. Explore distinctive homes, from cozy apartments to luxury villas, all in one place.">
  <meta name="theme-color" content="#ffffff">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Highr – A destination for distinctive homes">
  <meta property="og:description" content="Discover properties that match your lifestyle, from cozy apartments to luxury villas.">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

  <link rel="preload" href="assets/fonts/poppins-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/poppins-500.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Custom styles first, so the cascade layers below are declared in the right order -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Tailwind v4 Play CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme static {
      --font-sans: "Poppins", ui-sans-serif, system-ui, sans-serif;

      --color-ink: #1e1e1e;
      --color-ink-500: rgb(30 30 30 / 0.5);
      --color-ink-700: rgb(30 30 30 / 0.7);
      --color-ink-100: rgb(30 30 30 / 0.1);
      --color-smoke: #f5f5f5;
      --color-brand: #0968ff;
      --color-success: #2aa22e;
      --color-star: #ff9100;

      --text-h1: clamp(2.5rem, 1.55rem + 4.1vw, 5rem);
      --text-h1--line-height: 1.1;
      --text-h1--letter-spacing: -0.025em;
      --text-h2: clamp(2.125rem, 1.4rem + 3.1vw, 4rem);
      --text-h2--line-height: 1.1;
      --text-h2--letter-spacing: -0.047em;
      --text-h3: clamp(1.75rem, 1.35rem + 1.7vw, 2.5rem);
      --text-h3--line-height: 1.2;
      --text-h3--letter-spacing: -0.025em;
      --text-h4: clamp(1.375rem, 1.15rem + 1vw, 2rem);
      --text-h4--line-height: 1.2;
      --text-h4--letter-spacing: -0.031em;
      --text-lead: clamp(1.125rem, 1.05rem + 0.3vw, 1.5rem);
      --text-lead--line-height: 1.4;
      --text-body-lg: 1.25rem;
      --text-body-lg--line-height: 1.4;

      --breakpoint-xs: 30rem;
    }
  </style>
</head>

<body class="bg-white font-sans text-base font-medium text-ink antialiased">
  <script>document.documentElement.classList.add('js');</script>
  <a href="#main" class="skip-link">Skip to content</a>

  <header id="site-header" class="site-header">
    <div class="container-page">
      <div class="flex h-[var(--header-h)] items-center justify-between gap-4">
        <a href="#top" class="shrink-0" aria-label="Highr, back to top">
          <img src="assets/logos/logo-dark.svg" alt="Highr" width="109" height="33" class="h-auto w-[96px] sm:w-[110px]">
        </a>

        <nav id="site-nav" class="nav-panel" aria-label="Primary">
          <ul class="flex flex-col gap-1 lg:flex-row lg:items-center lg:gap-6">
            <li><a href="#about" class="nav-link" data-nav-link>About Us</a></li>
            <li><a href="#reviews" class="nav-link" data-nav-link>Reviews</a></li>
            <li><a href="#projects" class="nav-link" data-nav-link>Projects</a></li>
            <li><a href="#testimonial" class="nav-link" data-nav-link>Testimonial</a></li>
          </ul>
        </nav>

        <div class="flex items-center gap-2">
          <a href="#contact" class="btn !px-5 !py-3.5 sm:!px-7 sm:!py-4">
            <span class="btn__label"><span>Contact</span><span aria-hidden="true">Contact</span></span>
          </a>
          <button type="button" class="menu-toggle lg:hidden" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu" data-menu-toggle>
            <span class="menu-toggle__bar"></span>
            <span class="menu-toggle__bar"></span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main id="main">
    <!-- Hero -->
    <section id="top" class="hero bg-white" aria-labelledby="hero-title">
      <div class="container-page">
        <div class="mx-auto flex flex-col items-center gap-8 text-center">
          <div class="flex items-center gap-2 text-sm leading-none" data-reveal="fade">
            <span>Excellent</span>
            <span class="stars" style="--star: 15px" role="img" aria-label="5 out of 5 stars">
              <i class="icon icon-star"></i><i class="icon icon-star"></i><i class="icon icon-star"></i><i class="icon icon-star"></i><i class="icon icon-star"></i>
            </span>
            <span>4.8/5</span>
          </div>

          <h1 id="hero-title" class="max-w-[700px] text-h1" data-reveal data-split data-reveal-delay="100">
            A destination for distinctive homes
          </h1>

          <p class="max-w-[470px]" data-reveal data-reveal-delay="450">
            Discover properties that match your lifestyle, from cozy apartments to luxury villas, all in one place.
          </p>

          <div class="flex flex-wrap items-center justify-center gap-x-7 gap-y-5" data-reveal data-reveal-delay="600">
            <a href="#projects" class="btn">
              <span class="btn__label"><span>Explore listings</span><span aria-hidden="true">Explore listings</span></span>
            </a>
            <a href="#contact" class="link-quiet">Get consultation</a>
          </div>
        </div>
      </div>
    </section>

    <div class="hero-media" aria-hidden="false">
      <img src="assets/images/hero-background.webp" alt="Two modern glass residential towers rising above green treetops at dusk" width="1500" height="586" fetchpriority="high" class="hero-media__img" data-parallax="0.12">
    </div>

    <!-- @main -->
  </main>

  <!-- @footer -->

  <script src="js/reveal.js" defer></script>
  <script src="js/nav.js" defer></script>
  <script src="js/parallax.js" defer></script>
  <!-- @scripts -->
</body>
</html>
